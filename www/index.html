<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Voice Agent POC</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 560px; margin: 0 auto; padding: 24px 16px; background: #111; color: #eee; }
  h1 { font-size: 20px; text-align: center; }
  #mic { display: block; width: 120px; height: 120px; margin: 24px auto; border-radius: 50%;
         border: none; font-size: 48px; background: #2a2a2a; color: #fff; cursor: pointer; }
  #mic.live { background: #c0392b; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #status { text-align: center; min-height: 24px; color: #aaa; font-size: 14px; }
  .bubble { background: #1e1e1e; border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 15px; }
  .bubble.me { border-left: 3px solid #3498db; }
  .bubble.bot { border-left: 3px solid #2ecc71; }
  .bubble.perf { border-left: 3px solid #f39c12; font-size: 13px; }
  .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  #hint { text-align: center; color: #666; font-size: 13px; margin-top: 24px; }
  .perf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 6px; }
  .perf-row { display: flex; justify-content: space-between; }
  .perf-row .k { color: #aaa; }
  .rtf-good { color: #2ecc71; font-weight: bold; }
  .rtf-warn { color: #f39c12; font-weight: bold; }
  .rtf-bad { color: #e74c3c; font-weight: bold; }
  #statsbar { text-align: center; font-size: 12px; color: #888; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<h1>🎙️ Voice Agent POC</h1>
<button id="mic">🎤</button>
<button id="listenBtn" title="唤醒词聆听">🎧</button>
<div id="status">连接中…</div>
<div id="statsbar"></div>
<div id="log"></div>
<div id="hint">点麦克风开始说话，停顿约 1.5 秒自动结束<br>STT: FunASR Paraformer GGUF · TTS: Piper chaowen</div>
<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const micBtn = document.getElementById('mic');
const isTauri = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
const wsUrl = isTauri
  ? 'ws://127.0.0.1:8765/ws' // Tauri native client -> local Rust server
  : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/';
const ws = new WebSocket(wsUrl);

// native client (Tauri tray menu) asks for a fresh conversation
window.addEventListener('va-new-conversation', () => {
  if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type: 'new_conversation'}));
});

let recorder = null, stream = null, chunks = [], vadTimer = null, recording = false;

ws.onopen = () => { statusEl.textContent = '已连接，点麦克风开始'; };
ws.onclose = () => { statusEl.textContent = '连接断开，请刷新页面'; };
ws.onerror = () => { statusEl.textContent = '连接出错'; };
ws.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'stt') {
    addBubble('me', '你', msg.text || '(没听清)');
    botBubble = addBubble('bot', '助手', '');
    statusEl.textContent = '思考中…';
  } else if (msg.type === 'status') {
    statusEl.textContent = msg.text;
  } else if (msg.type === 'text') {
    if (botBubble) botBubble.lastChild.textContent += msg.delta;
  } else if (msg.type === 'audio') {
    audioQueue.push(msg);
    playNext();
  } else if (msg.type === 'done') {
    addPerfBubble(msg);
    statusEl.textContent = '已连接，点麦克风开始';
    micBtn.classList.remove('live');
  } else if (msg.type === 'error') {
    statusEl.textContent = '出错：' + msg.message;
    micBtn.classList.remove('live');
  } else if (msg.type === 'wake') {
    statusEl.textContent = '听到「' + (msg.keyword || '嘿助手') + '」，请讲…';
    startPcmRec();
  } else if (msg.type === 'interrupted') {
    statusEl.textContent = '已打断，聆听中…';
    micBtn.classList.remove('live');
  }
};

let botBubble = null;
const audioQueue = [];
let playing = false;
let curAudio = null;

function stopPlayback() {
  audioQueue.length = 0;
  playing = false;
  if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
}

function playNext() {
  if (playing || !audioQueue.length) return;
  playing = true;
  // open the mic tap so barge-in VAD can hear the user during playback
  ensureTap().catch(() => {});
  const msg = audioQueue.shift();
  const audio = new Audio('data:audio/wav;base64,' + msg.audio);
  curAudio = audio;
  audio.onended = () => { playing = false; curAudio = null; playNext(); };
  audio.onerror = () => { playing = false; curAudio = null; playNext(); };
  audio.play().catch(() => { playing = false; curAudio = null; playNext(); });
}

function rtfClass(rtf) {
  if (rtf < 0.5) return 'rtf-good';
  if (rtf < 1.0) return 'rtf-warn';
  return 'rtf-bad';
}

function addPerfBubble(msg) {
  const t = msg.timings;
  const d = document.createElement('div');
  d.className = 'bubble perf';
  const row = (k, v) => '<div class="perf-row"><span class="k">' + k + '</span><span>' + v + '</span></div>';
  let toolsHtml = '';
  if (msg.tool_calls && msg.tool_calls.length) {
    toolsHtml = msg.tool_calls.map(tc =>
      row('🔧 ' + tc.tool, tc.latency + 's <span style="color:#888">' + escapeHtml(tc.arg || '') + '</span>')
    ).join('');
  }
  d.innerHTML = '<div class="label">⏱ 性能（RTF &lt; 1 为实时）</div><div class="perf-grid">'
    + row('STT', t.stt + 's <span class="' + rtfClass(msg.rtf_stt) + '">RTF ' + msg.rtf_stt + '</span>')
    + (t.tool ? row('工具', t.tool + 's') : '')
    + row('首音延迟', '<b>' + msg.ttfb + 's</b>（' + msg.sentences + ' 句）')
    + row('TTS 合计', t.tts + 's')
    + row('总计', t.total + 's')
    + toolsHtml
    + '</div><div style="margin-top:6px;color:#888">输入 ' + msg.in_sec + 's → 输出 ' + msg.out_sec + 's</div>';
  logEl.prepend(d);
  document.getElementById('statsbar').innerHTML =
    '上轮：首音 <b>' + msg.ttfb + 's</b>'
    + ' · STT <span class="' + rtfClass(msg.rtf_stt) + '">RTF ' + msg.rtf_stt + '</span>'
    + ' · 总计 ' + t.total + 's';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addBubble(cls, label, text) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.innerHTML = '<div class="label">' + label + '</div><div></div>';
  d.lastChild.textContent = text;
  logEl.prepend(d);
  return d;
}

function pickMime() {
  const cands = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
  for (const c of cands) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c; }
  return '';
}

async function startRec() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const mime = pickMime();
  chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = sendUtterance;
  recorder.start(250);
  recording = true;
  micBtn.classList.add('live');
  statusEl.textContent = '聆听中…停顿自动结束，也可再点一次手动结束';
  watchSilence();
}

function watchSilence() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  const an = ctx.createAnalyser();
  an.fftSize = 1024;
  src.connect(an);
  const buf = new Float32Array(an.fftSize);
  let quietSince = Date.now();
  vadTimer = setInterval(() => {
    if (!recording) { clearInterval(vadTimer); ctx.close(); return; }
    an.getFloatTimeDomainData(buf);
    let rms = 0;
    for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / buf.length);
    if (rms < 0.02) {
      if (Date.now() - quietSince > 1500 && chunks.length > 0) stopRec();
    } else quietSince = Date.now();
  }, 200);
}

function stopRec() {
  if (!recording) return;
  recording = false;
  clearInterval(vadTimer);
  try { recorder.stop(); } catch (e) {}
  stream.getTracks().forEach(t => t.stop());
}

function sendUtterance() {
  micBtn.classList.remove('live');
  statusEl.textContent = '识别中…';
  const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
  const rd = new FileReader();
  rd.onload = () => {
    const b64 = rd.result.split(',')[1];
    ws.send(JSON.stringify({ type: 'utterance', data: b64 }));
  };
  rd.readAsDataURL(blob);
}

micBtn.onclick = () => {
  if (pcmRec) { stopPcmRec(); return; }
  recording ? stopRec() : startRec().catch(e => {
    statusEl.textContent = '无法使用麦克风：' + e.message;
  });
};

// ---------- wake word listen mode + barge-in ----------
// Single continuous mic tap (16kHz) feeding three consumers:
//  1. ring buffer (last 1.5s) — seeds recordings so the start of speech
//     isn't clipped by wake-word/barge-in detection lag
//  2. audio_chunk streaming — server-side keyword spotting (listen mode)
//  3. barge-in energy VAD while assistant audio is playing
const listenBtn = document.getElementById('listenBtn');
let listenMode = false;
let tap = null;
let ring = [];
const RING_MAX = 24000; // 1.5s @ 16kHz
let chunkSeq = 0;
let pcmRec = null;
let bargeHotSince = 0;

async function ensureTap() {
  if (tap) return tap;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(proc);
  proc.connect(mute);
  mute.connect(ctx.destination);
  proc.onaudioprocess = onTapAudio;
  tap = { ctx, stream };
  return tap;
}

function onTapAudio(e) {
  const ch = e.inputBuffer.getChannelData(0);
  const s16 = new Int16Array(ch.length);
  for (let i = 0; i < ch.length; i++) {
    const v = Math.max(-1, Math.min(1, ch[i]));
    s16[i] = v < 0 ? v * 32768 : v * 32767;
  }
  for (let i = 0; i < s16.length; i++) ring.push(s16[i]);
  if (ring.length > RING_MAX) ring.splice(0, ring.length - RING_MAX);

  // 1) wake-word streaming (idle only)
  if (listenMode && !recording && !playing && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'audio_chunk', seq: chunkSeq++, data: b64encode(new Uint8Array(s16.buffer)) }));
  }
  // 2) barge-in VAD during playback
  if (playing && !recording) bargeVad(s16);
  // 3) PCM utterance recording (wake / barge-in flows)
  if (pcmRec) pcmFeed(s16);
}

function bargeVad(s16) {
  let sum = 0;
  for (let i = 0; i < s16.length; i++) sum += s16[i] * s16[i];
  const rms = Math.sqrt(sum / s16.length) / 32768;
  const now = Date.now();
  if (rms > 0.06) {
    if (!bargeHotSince) bargeHotSince = now;
    if (now - bargeHotSince > 300) {
      bargeHotSince = 0;
      doBargeIn();
    }
  } else bargeHotSince = 0;
}

function doBargeIn() {
  stopPlayback();
  if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'interrupt' }));
  statusEl.textContent = '已打断，聆听中…';
  startPcmRec();
}

// Start a PCM recording seeded with the last 1.0s of the ring buffer,
// covering wake-word / barge-in detection lag.
function startPcmRec() {
  pcmRec = { samples: ring.slice(-16000), quietSince: Date.now(), hasVoice: false };
  recording = true;
  micBtn.classList.add('live');
  statusEl.textContent = '聆听中…停顿自动结束';
}

function pcmFeed(s16) {
  const r = pcmRec;
  for (let i = 0; i < s16.length; i++) r.samples.push(s16[i]);
  let sum = 0;
  for (let i = 0; i < s16.length; i++) sum += s16[i] * s16[i];
  const rms = Math.sqrt(sum / s16.length) / 32768;
  if (rms > 0.02) { r.quietSince = Date.now(); r.hasVoice = true; }
  else if (r.hasVoice && Date.now() - r.quietSince > 1500) stopPcmRec();
}

function stopPcmRec() {
  const samples = pcmRec.samples;
  pcmRec = null;
  recording = false;
  micBtn.classList.remove('live');
  statusEl.textContent = '识别中…';
  ws.send(JSON.stringify({ type: 'utterance', data: b64encode(new Uint8Array(encodeWav(samples, 16000))) }));
}

function encodeWav(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
  v.setUint32(28, sampleRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, samples[i], true);
  return buf;
}

function b64encode(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  }
  return btoa(s);
}

listenBtn.onclick = async () => {
  try {
    if (!listenMode) {
      await ensureTap();
      listenMode = true;
      listenBtn.classList.add('live');
      statusEl.textContent = '唤醒词聆听中…（嘿助手）';
    } else {
      listenMode = false;
      listenBtn.classList.remove('live');
      statusEl.textContent = '已连接，点麦克风开始';
    }
  } catch (e) {
    statusEl.textContent = '无法使用麦克风：' + e.message;
  }
};
</script>
</body>
</html>
